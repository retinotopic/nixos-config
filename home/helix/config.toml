theme = "everforest_dark_soft"

[editor]
mouse = true
auto-completion = true
cursorline = false
cursorcolumn = false
auto-format = true
idle-timeout = 300
completion-trigger-len = 2
auto-info = true
shell = ["sh", "-c"]
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
true-color = true
bufferline = "multiple"

[editor.auto-save]
focus-lost = true

[editor.indent-guides]
render = true
character = "|"
skip-levels = 1

[editor.whitespace.characters]
nbsp = "⍽"
tab = "→"
newline = "⏎"

# [editor.whitespace.render]
# space = "all"
# tab = "all"
# newline = "none"

# [editor.auto-pairs]
# '(' = ')'
# '{' = '}'
# '[' = ']'
# '"' = '"'
# '`' = '`'
# '<' = '>'

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = [
    "mode",
    "spinner",
    "total-line-numbers",
    "workspace-diagnostics",
]

global = true
# center = ["file-name"]

right = [
    "diagnostics",
    "selections",
    "position",
    "file-encoding",
    "file-line-ending",
    "file-type",
]
separator = "│"

mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-progress-messages = true
auto-signature-help = true
display-signature-help-docs = true

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
